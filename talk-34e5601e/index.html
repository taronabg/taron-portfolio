<style>html,body{margin:0;background:#000;color:#f2f2f2;font-family:-apple-system,Helvetica,Arial,sans-serif}#c{position:fixed;top:8px;right:16px;color:#888;font-size:20px}#d{display:inline-block;width:10px;height:10px;border-radius:50%;background:#a33;margin-left:8px}#t{height:calc(100vh - 70px);overflow:auto;padding:24px 48px 0;font-size:var(--fs,40px);line-height:1.35}#t p{margin:0 0 .55em}#t i{color:#e0a526;font-size:.6em}#x{position:fixed;bottom:0;left:0;right:0;padding:14px 48px;color:#777;font-size:20px;background:#000;border-top:1px solid #222}</style></head><body>
<div id=c><span id=n></span><span id=d title="sync"></span></div><div id=t></div><div id=x></div>
<script>
const S=["<p><i>Up while Jesus, Ana and Ariel introduce you. Title: \"Your work is better than your website.\"<\/i><\/p>", "<p>Jesus, Ana, Ariel, thank you. Happy Friendsgiving, everybody.<\/p><p>Real quick, raise your hand if you've ever looked someone up before you called them. <i>[hands go up; Jesus or Ana raise theirs first]<\/i><\/p><p>Yeah. Pretty much everybody.<\/p><p>Now keep it up if you've ever <b>not<\/b> called because of what you found. <i>[some hands, laughs]<\/i><\/p><p>That second group is why I'm here.<\/p><p>My name is Taron Abgaryan. I build websites for contractors and local businesses, so when people look you up, they call you.<\/p>", "<p>I built this group's website.<\/p><p>And almost nobody in this group has seen it yet.<\/p>", "<p><i>Share the EVV site tab. Backup: ~/Desktop/evv/EVV-Connect-Walkthrough.mp4 in a second tab.<\/i><\/p><p>This is it. This is real, I'm clicking it.<\/p><p>Here, I'll refresh the page, so you know it's not a video. <i>[refresh]<\/i><\/p><p>EVV Connect. That's your line, right at the top.<\/p><p>This is the directory. Every member gets a profile. Your trade, your town, how to reach you.<\/p><p>Here's the first one. Jesus R. Lopez, Modern Home Projects.<\/p><p>And Ana B. Pinedo, Catanese Real Estate.<\/p><p>And Ariel Sanchez Sanchez, who runs The Rooftop, the room you're sitting in tonight.<\/p><p>Three names in it tonight. Yours goes here next.<\/p><p>Everybody, give it up for Jesus and Ana for starting this group, and Ariel for hosting us tonight. <i>[stop talking until the applause ends]<\/i><\/p><p>And one last page. This is the membership page. Look at what it says you need to join. <i>[pause, let them read]<\/i><\/p><p>\"A professional website for your business.\" And \"A Google Business Profile with 5+ genuine reviews.\"<\/p><p>Jesus and Ana wrote that rule. Hold on to it. I'm coming back to it in a minute.<\/p><p>It's live right now at evvconnect.com. Pull it up on your phone.<\/p>", "<p><i>Stop sharing. Back to the deck.<\/i><\/p><p>I was born in Yerevan, Armenia, and I moved to the United States when I was eleven. I speak English, Armenian, Russian and Spanish.<\/p><p>I'm one of the hosts of this group, and I hold its Marketing &amp; Web seat, so I'm one of you. I've built more than fifteen websites for contractors and local businesses, and my first client is in that room with you. <i>[pause; the room turns to look]<\/i> Jesus.<\/p><p>This fall, Jesus sent me a construction company that a big website company had treated poorly. Remember them.<\/p>", "<p>Now some of you are already thinking, \"I don't need a website. All my work comes from referrals.\"<\/p><p>I know. That's exactly why this is for you. Referrals are the reason it matters. Stay with me two minutes and I'll show you.<\/p><p>Quick show of hands. Who here has a website? <i>[pause]<\/i> Who doesn't? <i>[pause]<\/i> Who'd like one? <i>[pause]<\/i><\/p><p>Now, if you have one, keep your hand up if you like it. <i>[pause]<\/i> And keep it up if you can text your designer today and get a change made this week. <i>[say what you see, e.g. \"Not many hands left.\"]<\/i><\/p><p>Look around. That's why I'm here tonight.<\/p>", "<p>So here's the one thing I want you to remember tonight. Everyone looks you up before they call.<\/p><p>Say it with me. Everyone looks you up before they call.<\/p>", "<p>And let me tell you right now, I'm going to make one offer at the end, and I'll tell you the price out loud. I'd rather get it out of the way so you can enjoy the night.<\/p><p>It starts free. And I'll ask you one thing about the people you know. That's it. Is that fair?<\/p>", "<p>Remember that rule on the membership page?<\/p><p>Think about that. Jesus and Ana could've made the rule anything. They made it that. Why would a referral group require a website?<\/p><p>Because they know. When someone in this room says \"call my guy,\" the first thing that person does is look your guy up.<\/p>", "<p>So picture it. You send your neighbor to a deck builder you love. Best work in Evansville. Your neighbor types his name into Google.<\/p><p>And one of two things comes up. A real website with his jobs and his face and a button to call. Or nothing. An old Facebook page. A listing with no pictures.<\/p><p>Same contractor. Same work. Same referral from you. Which one does your neighbor call?<\/p><p>Right. People don't hire the best contractor. They hire the one who looks best when they look him up.<\/p><p>And here's the part nobody says out loud. When your neighbor looks up the guy you sent and finds nothing, it doesn't only make him look bad. It makes you look bad. You put your name on him.<\/p><p>Now let me ask you something, and just shout it out. What's one good job worth to you? One deck, one closing, one case, one wedding. Shout it out.<\/p><p>\"I heard [number]. [number]. Somebody said [number].\"<\/p><p>Those numbers you just said? That's what's riding on ten seconds on a phone. Every time.<\/p>", "<p>Now the second thing I hear. \"I paid for a website before, and I got nothing.\"<\/p><p>Maybe that company just wasn't any good. Sure. But also maybe you never saw the site before you paid for it, and nobody picked up the phone after.<\/p><p>Remember the construction company I told you about? This is them. RPR Construction, Owensboro, Kentucky. Jesse and Austin.<\/p><p>So they'd been burned once, and they weren't in a hurry to get burned again.<\/p><p>So I did what I do for everybody. I designed their whole website first, every page, with their real jobs on it, before they paid me anything. They clicked through it, and they liked it.<\/p>", "<p>Here's what Austin wrote on Google. I'm going to read it exactly the way he wrote it.<\/p><p>\"Built my construction company's website very professional and well built. very happy. If your looking to have a site built this is your guy.\"<\/p><p>You want to know who sent them to me? <i>[pause]<\/i> Jesus.<\/p>", "<p>Everyone looks you up before they call.<\/p>", "<p>Last Thursday, 10:34 at night, I'm at my desk, and I text Jesus: \"You're not gonna believe it lol. I already built it. Well I just finished. Check it out.\" And the link.<\/p><p>No price, no pitch. Just the whole EVV Connect site, finished, with his name and Ana's on it.<\/p><p>Jesus has a contracting company to run, and he coaches other contractors. Nobody in that position builds a website for thirty people after a full day's work.<\/p><p>Then the texts come in. <i>[read them off the screenshot exactly as he wrote them; the emojis are on screen, say the words]<\/i> \"Broooo\" · \"Looks amazing!!!\" · \"I am sorry i miss your text, I am working on something and I have my phone on: \"Do Not Disturb\"\" · \"Looks awesome!!!\" · \"I ABSOLUTELY LOVE IT BROTHER! thank you!!!!!\" · \"Let's Get it!\" <i>[stop; say nothing over it]<\/i><\/p>", "<p>That's how a busy owner buys. He didn't need it explained. He needed to see it.<\/p><p>Would you like me to show you how you can see yours finished first, for you, or for somebody you know?<\/p><p>Okay.<\/p>", "<p>Here's what I'm offering this room. It's called the EVV Founding Member Website.<\/p><p>It starts free. Text me, and I design your whole website first. Every page, your real work, your town.<\/p><p>We hop on a 15-minute call, you click through it like it's live, and if you don't love the design before you buy, you owe nothing.<\/p>", "<p>If you do, here's what you get. Your site, built from scratch, live in two to three weeks. Your Google Business Profile set up. Five professional emails with your business name. Hosting, upkeep, and up to five changes a month: you text me, and it's done.<\/p><p>And if your business takes payments, I set up online payments so customers can pay you by card. I did that for EVV Connect this week. It's how you'll join tonight.<\/p><p>I structure your website for growth. Every page is built to make it easy for a customer to call you, book you, or pay you.<\/p><p>And you're never stuck with me. Some of you have been with a company where you leave and your website stays with them. RPR came to me from one of those. Here, if you ever want to leave, you buy the website out from me and take everything with you.<\/p><p>For founding members I'm adding the rest of what this group asks for: your Facebook business page, a simple way to get your customers' reviews in, and your EVV directory profile, built and linked to your site. <i>(Cut \"and your EVV directory profile, built and linked to your site\" if Jesus hasn't said yes.)<\/i><\/p>", "<p>Now, price. I'm going to say it out loud, because the number one thing I hear is \"nobody ever tells you the price.\"<\/p><p>Town Square Media charges $350 to $550 a month for a website. Hibu charges around $500 a month. That's $4,200 to $6,600 a year, every year, and when you stop paying, the site stays with them.<\/p><p>Mine is $3,000 a year, everything in, and it doesn't go up when you renew.<\/p><p>For founding members of EVV Connect, the people here tonight, it's $2,500 a year. Not just the first year. Every year you keep it. The price you start at is the price you keep.<\/p><p>Half to start, half the day it goes live.<\/p><p>And if your company needs more, like more pages, booking, an online store, or a CRM to track your leads and customers, I have bigger packages. Grab me after and we'll talk.<\/p>", "<p>I build every site myself, one at a time. So I have four slots open for December, and they go in the order your texts come in.<\/p><p>And if you're number five, or number ten, that's okay. As long as you text me by Wednesday, December 2nd, your price is $2,500 whenever I get to your project.<\/p><p>And here's my promise. If your site isn't live within two weeks of me getting your photos, your next year is on me.<\/p><p>And so you know that's real: RPR Construction signed October 30th and went live November 11th.<\/p><p>After December 2nd it's $3,000. The mockup is still free, and you still see your whole site before you pay a dollar.<\/p><p>And if I look at your business and honestly don't think a website would help you, I'll tell you, and I won't take your money. Because that would make me look bad. In front of you, and in front of Jesus.<\/p>", "<p>And for the people you know. Every one of you knows a contractor whose work is better than their website. Text me their name.<\/p><p>I'll design them a free full mockup, and it comes from you. They never asked for it; you're the one who thought of them. You look good, I do the work.<\/p><p>You make the intro. That's it. I handle everything after, including the price. You never sell anything and you never promise anything.<\/p><p>If they sign, that's $200 in your pocket. Every client who signs, $200.<\/p><p>And if they don't love it, they owe nothing. Your name never costs your friend a dollar.<\/p><p>And look, whatever you decide, I'm going to be just fine, trust me.<\/p>", "<p>Here's the last thing. Your motto is \"We know somebody that knows somebody that knows somebody.\"<\/p><p>So we're the somebodies. The people people call when they need a name. And when we send somebody a name, we want that name to make us look good.<\/p>", "<p>So here's the one ask.<\/p><p>Phones out. Point your camera at this code. It opens a text to me that's already written: \"Hi Taron, it's blank from EVV. Mockup for: me, or someone I know.\" Put your name in, keep the one that's true, hit send.<\/p><p>Camera won't scan? The number's right under it. 626-225-3435.<\/p><p>Here's what happens when you send it. <i>[a host's test text lands on your phone, live; read the name out]<\/i> That's it. I answer every one of these myself, tonight.<\/p><p>You said it with me tonight: everyone looks you up before they call. So send it now, while the code's on the screen, because the four slots go in the order your texts come in.<\/p><p>Jesus, Ana, Ariel, give everyone one minute. I'll be quiet, and I'll just say the names as they come in.<\/p><p><i>[60 seconds of quiet, broken only by first names as texts land: \"Got yours, [Name].\" Nothing else.]<\/i><\/p><p>One more thing I want to do before I wrap up and go to questions. Jesus, would you mind taking 30 seconds and just telling the group what it was like to work with me?<\/p><p><i>[Jesus talks. Say nothing over him. Then:]<\/i> Thank you, Jesus.<\/p><p><b>Q&amp;A<\/b><\/p><p>Okay, let me answer the four questions I always get, and then I'll take yours.<\/p><p>Number one. \"What's it going to cost? Nobody ever tells you the price.\"<\/p><p>$3,000 a year, everything in. $2,500 for founding members who text by December 2nd, and it stays $2,500 every year you keep it. And you see your whole site before you pay a dollar.<\/p><p>Number two. \"Am I going to get locked into a contract?\"<\/p><p>No monthly contract. There's nothing to sign until you've seen your finished site and you like it.<\/p><p>Number three. \"If I ever leave, do I lose my website?\"<\/p><p>No. If you ever leave, you buy the website out from me, and everything goes with you. Your name, your domain, your photos.<\/p><p>Number four. \"Is it just going to be a template?\"<\/p><p>No. Every site I build is designed from scratch around the business it's for. You saw this group's site and you saw RPR's. They look nothing alike, because they're not the same business.<\/p><p>Okay, your turn. What questions do you have? And if you just texted me, I'll answer you by name right now.<\/p><p>[Name], I just got yours. <i>[read the first name and \"me\" or \"someone I know\"; reply to every one that night]<\/i><\/p>", "<p><i>After Q&amp;A, press → for the hosts. This is their membership ask, not yours.<\/i><\/p><p>And remember, membership asks for a professional website. If you don't have one yet, my number is right there at the bottom.<\/p><p>Jesus, Ana, Ariel, over to you.<\/p><p><i>[Stop talking. Leave the code up while they ask the room to join.]<\/i><\/p>"],T="evvnotes-e24314efd886";let i=0,fs=40;
function show(k){i=Math.max(0,Math.min(S.length-1,k));n.textContent=(i+1)+' / '+S.length;t.innerHTML=S[i];t.scrollTop=0;const nx=S[i+1]?S[i+1].replace(/<[^>]+>/g,' ').trim().slice(0,90)+'…':'(last slide)';x.textContent='Next: '+nx}
const n=document.getElementById('n'),t=document.getElementById('t'),x=document.getElementById('x'),d=document.getElementById('d');
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='='||e.key==='+'){fs+=4}else if(e.key==='-'){fs=Math.max(20,fs-4)}else if(e.key==='ArrowDown'){t.scrollBy(0,120)}else if(e.key==='ArrowUp'){t.scrollBy(0,-120)}document.documentElement.style.setProperty('--fs',fs+'px')});
function apply(m){const k=parseInt(m,10);if(!isNaN(k))show(k)}
fetch('https://ntfy.sh/'+T+'/json?poll=1&since=12h').then(r=>r.text()).then(tx=>{const L=tx.trim().split('\n').filter(Boolean).map(l=>JSON.parse(l)).filter(o=>o.event==='message');if(L.length)apply(L[L.length-1].message)}).catch(()=>{});
function connect(){const es=new EventSource('https://ntfy.sh/'+T+'/sse');es.onopen=()=>d.style.background='#2a2';es.onmessage=e=>{try{const o=JSON.parse(e.data);if(o.event==='message')apply(o.message)}catch(_){}};es.onerror=()=>{d.style.background='#a33'}}
show(0);connect();
</script></body></html>
